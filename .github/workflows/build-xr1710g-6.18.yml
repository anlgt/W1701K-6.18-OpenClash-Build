name: Build XR1710G 6.18.53 Best-Effort OpenClash Sysupgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - xr1710g-6.18.53-rebuild
    paths:
      - .github/workflows/build-xr1710g-6.18.yml
      - xr1710g-6.18-openclash.config
      - xr1710g-files/**

permissions:
  contents: write

concurrency:
  group: xr1710g-6.18-openclash-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_URL: https://github.com/YYH2913/openwrt.git
  SOURCE_COMMIT: c82129e7348fda30b9e2f90572e4f1b3c555c7f2
  COMMUNITY_URL: https://github.com/orangeyoo/XR1710G-OpenWrt-iStoreOS-Community.git
  COMMUNITY_COMMIT: c00aac00260fcf9506891afebf505ea81b6a0846
  KERNEL_VERSION: 6.18.53
  KERNEL_HASH: 4d6fba95c2244b08a7b4144a4d38b9be4fb31abb5e7682ae40bb5cb11374cfe0
  MT76_VERSION: b2704cf5a4068b672bf47ad5bf6b4802b6770a90
  MT76_HASH: fc94437f3271a16d3865c16ec3bbdf828ac18a730953a74fc80f76abf461eb67
  PACKAGES_COMMIT: 1c2ce769a8a87cc41caf23397628b1eaa8875c82
  LUCI_COMMIT: 6e1eb21fae71304965621cc7df93259a18a3a93e
  ROUTING_COMMIT: 4b9891b9136259f93294a424507ed24c5e8c1cbd
  OPENCLASH_TAG: v0.47.156
  OPENCLASH_COMMIT: c3a33c1d3407956fdf8f0e0b7c1a4c52e6ad9593
  ARGON_THEME_COMMIT: 2a28799ca063aba7edc3314143b93c8325c86df4
  MIHOMO_TAG: v1.19.30
  MIHOMO_URL: https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-arm64-v1.19.30.gz
  MIHOMO_SHA256: 58896873736d28628f66de3677c8654fa0f180662523148e136cff4f6e890069
  RELEASE_TAG: xr1710g-6.18.53-reconstruction-r${{ github.run_number }}-${{ github.run_attempt }}
  GH_TOKEN: ${{ github.token }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar file flex gawk genisoimage gettext gcc-multilib g++-multilib git \
            libgnutls28-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev lld llvm \
            lrzsz msmtp nano ninja-build p7zip-full patch pkgconf \
            python3 python3-dev python3-docutils python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rename rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Reclaim build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 6144
          swap-size-mb: 2048
          remove-android: true
          remove-codeql: true
          remove-docker-images: true
          remove-dotnet: true
          remove-haskell: true

      - name: Checkout build definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fetch the verified XR1710G source
        run: |
          git init openwrt
          git -C openwrt remote add origin "$SOURCE_URL"
          git -C openwrt fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$SOURCE_COMMIT"

          grep -Fqx 'KERNEL_PATCHVER:=6.18' openwrt/target/linux/airoha/Makefile
          grep -Fqx 'LINUX_VERSION-6.18 = .44' openwrt/target/linux/generic/kernel-6.18
          grep -Fq 'define Device/gemtek_xr1710g-ubi' \
            openwrt/target/linux/airoha/image/an7581.mk
          grep -Fq 'compatible = "gemtek,xr1710g-ubi"' \
            openwrt/target/linux/airoha/dts/an7581-xr1710g-ubi.dts
          grep -Fq 'DEVICE_COMPAT_VERSION := 2.0' \
            openwrt/target/linux/airoha/image/an7581.mk
          grep -Fq 'IMAGE/sysupgrade.itb := append-kernel' \
            openwrt/target/linux/airoha/image/an7581.mk

          python3 - <<'PY'
          from pathlib import Path
          p = Path('openwrt/target/linux/airoha/image/an7581.mk')
          s = p.read_text()
          device_start = s.index('define Device/gemtek_xr1710g-ubi\n')
          packages_start = s.index('DEVICE_PACKAGES :=', device_start)
          packages_end = s.index('UBINIZE_OPTS := -E 5', packages_start)
          old = s[packages_start:packages_end]
          for package in ('ethtool-full', 'iperf3', 'kmod-airoha-net-debug',
                          'luci-app-mlo', 'luci-app-package-manager',
                          'luci-theme-glass', 'openssh-sftp-server', 'tcpdump'):
              if package not in old:
                  raise SystemExit(f'Expected XR1710G device package is missing: {package}')
          new = '''DEVICE_PACKAGES := airoha-en7581-mt7996-npu-firmware \\
            fitblk ip-bridge ip-full \\
            kmod-hwmon-nct7802 kmod-i2c-an7581 \\
            kmod-mt7996-firmware kmod-phy-realtek rtl826x-firmware \\
            luci luci-app-firewall \\
            luci-i18n-airoha-npu-zh-cn luci-i18n-base-zh-cn \\
            luci-i18n-firewall-zh-cn luci-mod-admin-full luci-proto-ppp \\
            px5g-mbedtls rpcd-mod-rrdns uhttpd uhttpd-mod-ubus \\
            wpad-basic-mbedtls'''
          p.write_text(s[:packages_start] + new + '\n\n' + s[packages_end:])
          PY

          git init /tmp/xr1710g-community
          git -C /tmp/xr1710g-community remote add origin "$COMMUNITY_URL"
          git -C /tmp/xr1710g-community fetch --depth 1 origin "$COMMUNITY_COMMIT"
          git -C /tmp/xr1710g-community checkout --detach FETCH_HEAD
          test "$(git -C /tmp/xr1710g-community rev-parse HEAD)" = "$COMMUNITY_COMMIT"

      - name: Reconstruct the public Linux 6.18.53 kernel baseline
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('target/linux/generic/kernel-6.18')
          s = p.read_text()
          kernel_version = os.environ['KERNEL_VERSION']
          kernel_minor = kernel_version.rsplit('.', 1)[1]
          kernel_hash = os.environ['KERNEL_HASH']
          old = ('LINUX_VERSION-6.18 = .44',
                 'LINUX_KERNEL_HASH-6.18.44 = 0f72d938f06828e82c90405174fe572287db7bfe089e2fc46572a99a7f240d43')
          new = (f'LINUX_VERSION-6.18 = .{kernel_minor}',
                 f'LINUX_KERNEL_HASH-6.18.{kernel_minor} = {kernel_hash}')
          for before, after in zip(old, new):
              if s.count(before) != 1:
                  raise SystemExit(f'Expected exactly one pinned kernel line: {before}')
              s = s.replace(before, after, 1)
          p.write_text(s)
          PY
          grep -Fqx 'LINUX_VERSION-6.18 = .53' target/linux/generic/kernel-6.18
          grep -Fqx 'LINUX_KERNEL_HASH-6.18.53 = 4d6fba95c2244b08a7b4144a4d38b9be4fb31abb5e7682ae40bb5cb11374cfe0' target/linux/generic/kernel-6.18

      - name: Apply the publicly disclosed XR1710G MT76 and PPE fixes
        working-directory: openwrt
        run: |
          mt76_makefile=package/kernel/mt76/Makefile
          grep -Fqx 'PKG_RELEASE=4' "$mt76_makefile"
          grep -Fqx 'PKG_SOURCE_DATE:=2026-07-01' "$mt76_makefile"
          grep -Fqx 'PKG_SOURCE_VERSION:=59676919ea408b0b13a9d23f2e2e1a1ab407fba1' "$mt76_makefile"
          sed -i \
            -e 's/^PKG_RELEASE=4$/PKG_RELEASE=7/' \
            -e 's/^PKG_SOURCE_DATE:=2026-07-01$/PKG_SOURCE_DATE:=2026-08-01/' \
            -e "s/^PKG_SOURCE_VERSION:=59676919ea408b0b13a9d23f2e2e1a1ab407fba1$/PKG_SOURCE_VERSION:=$MT76_VERSION/" \
            -e "s/^PKG_MIRROR_HASH:=8a6dc6dac37ed56fcbfd874359f5c25acb65bcfaa795d50494cba17c98405dd5$/PKG_MIRROR_HASH:=$MT76_HASH/" \
            "$mt76_makefile"
          grep -Fqx "PKG_SOURCE_VERSION:=$MT76_VERSION" "$mt76_makefile"
          grep -Fqx "PKG_MIRROR_HASH:=$MT76_HASH" "$mt76_makefile"

          mt76_patch_dir=package/kernel/mt76/patches
          mkdir -p "$mt76_patch_dir"
          find "$mt76_patch_dir" -maxdepth 1 -type f -name '*.patch' -delete
          for patch in \
            0099-wifi-mt76-mt7996-report-only-terminal-tx-failures.patch \
            0100-xr1710g-rebase-yyh-an7581-npu-stack-on-b2704cf5.patch \
            0102-wifi-mt76-mt7996-pass-operating-mode-to-rate-control.patch \
            0103-wifi-mt76-mt7996-set-skb-device-for-npu-rx.patch \
            0104-mt7996-unlink-rejected-twt-flow.patch \
            0105-mt76-fix-disassociated-station-queue.patch; do
            install -m 0644 "/tmp/xr1710g-community/patches/mt76/$patch" "$mt76_patch_dir/$patch"
          done
          grep -Fq 'mt7996_mcu_get_per_sta_info' "$mt76_patch_dir/0100-xr1710g-rebase-yyh-an7581-npu-stack-on-b2704cf5.patch"
          grep -Fq 'ra->op_vht_rx_nss = link_sta->rx_nss ? link_sta->rx_nss - 1 : 0;' "$mt76_patch_dir/0102-wifi-mt76-mt7996-pass-operating-mode-to-rate-control.patch"
          grep -Fq 'skb->dev = ieee80211_vif_to_wdev(vif)->netdev' "$mt76_patch_dir/0103-wifi-mt76-mt7996-set-skb-device-for-npu-rx.patch"

          kernel_patch_dir=target/linux/airoha/patches-6.18
          ppe_patch=9991-net-airoha-protect-local-bridge-flows-from-ppe-fallback.patch
          test -f "$kernel_patch_dir/9990-net-airoha-bind-WLAN-bound-flows-on-PPE-driver-L2-cache-miss.patch"
          install -m 0644 "/tmp/xr1710g-community/patches/kernel/$ppe_patch" "$kernel_patch_dir/$ppe_patch"
          grep -Fq 'egress == skb->dev' "$kernel_patch_dir/$ppe_patch"

      - name: Pin feeds and third-party LuCI packages
        working-directory: openwrt
        run: |
          printf '%s\n' \
            "src-git packages https://github.com/openwrt/packages.git^$PACKAGES_COMMIT" \
            "src-git luci https://github.com/openwrt/luci.git^$LUCI_COMMIT" \
            "src-git routing https://github.com/openwrt/routing.git^$ROUTING_COMMIT" \
            > feeds.conf
          ./scripts/feeds update -a
          test "$(git -C feeds/packages rev-parse HEAD)" = "$PACKAGES_COMMIT"
          test "$(git -C feeds/luci rev-parse HEAD)" = "$LUCI_COMMIT"
          test "$(git -C feeds/routing rev-parse HEAD)" = "$ROUTING_COMMIT"
          ./scripts/feeds install -a

          clone_pinned() {
            repo_url="$1"
            repo_commit="$2"
            destination="$3"
            git init "$destination"
            git -C "$destination" remote add origin "$repo_url"
            git -C "$destination" fetch --depth 1 origin "$repo_commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$repo_commit"
          }

          clone_pinned https://github.com/vernesong/OpenClash.git \
            "$OPENCLASH_COMMIT" package/OpenClash
          grep -Fqx 'PKG_VERSION:=0.47.156' \
            package/OpenClash/luci-app-openclash/Makefile

          clone_pinned https://github.com/jerrykuku/luci-theme-argon.git \
            "$ARGON_THEME_COMMIT" package/extra/luci-theme-argon

          cp -a /tmp/xr1710g-community/apps/luci-app-airoha-npu \
            package/extra/luci-app-airoha-npu
          cp -a /tmp/xr1710g-community/apps/luci-app-airoha-fancontrol \
            package/extra/luci-app-airoha-fancontrol
          cp -a /tmp/xr1710g-community/apps/xr1710g-status-core \
            package/extra/xr1710g-status-core

      - name: Bundle the verified ARM64 Mihomo core
        working-directory: openwrt
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$MIHOMO_URL" -o /tmp/mihomo-arm64.gz
          echo "$MIHOMO_SHA256  /tmp/mihomo-arm64.gz" | sha256sum -c -
          gzip -t /tmp/mihomo-arm64.gz
          install -d package/OpenClash/luci-app-openclash/root/etc/openclash/core
          gzip -dc /tmp/mihomo-arm64.gz \
            > package/OpenClash/luci-app-openclash/root/etc/openclash/core/clash_meta
          chmod 0755 package/OpenClash/luci-app-openclash/root/etc/openclash/core/clash_meta
          file package/OpenClash/luci-app-openclash/root/etc/openclash/core/clash_meta \
            | grep -q 'ARM aarch64'

      - name: Add XR1710G defaults and build record
        run: |
          install -d openwrt/files
          cp -a xr1710g-files/. openwrt/files/
          chmod 0755 openwrt/files/etc/uci-defaults/99-xr1710g-custom-defaults

          printf '%s\n' \
            'XR1710G 6.18.53 best-effort reconstruction' \
            "source=$SOURCE_URL" \
            "source_commit=$SOURCE_COMMIT" \
            'kernel=6.18.53 (kernel.org stable source over YYH .44 OpenWrt tree)' \
            "community_packages_commit=$COMMUNITY_COMMIT" \
            "mt76_source=$MT76_VERSION" \
            'public_mt76_backports=0099,0102,0103,0104,0105; NPU stack rebased by 0100' \
            'public_ppe_guard=9991' \
            'skipped_redundant_backports=706-mhi-irq,751-qca8k-force-mode (already present in Linux 6.18.53)' \
            'v1.9_source_match=unavailable-source-not-published' \
            "openclash=$OPENCLASH_TAG" \
            "mihomo=$MIHOMO_TAG" \
            'themes=argon-only' \
            'wireguard=not-included' \
            'matching_apk_repository=not-published' \
            > openwrt/files/etc/xr1710g-build-info

      - name: Configure the minimal XR1710G image
        run: |
          cp xr1710g-6.18-openclash.config openwrt/.config
          cd openwrt
          make defconfig

          required_packages='apk-mbedtls luci-base luci-mod-admin-full luci-app-firewall luci-compat luci-i18n-base-zh-cn luci-theme-argon luci-app-openclash bash ca-bundle curl dnsmasq-full ip-full kmod-inet-diag kmod-nft-tproxy kmod-tun ruby ruby-yaml unzip luci-app-upnp luci-i18n-upnp-zh-cn miniupnpd-nftables coreutils-nohup etherwake irqbalance luci-app-irqbalance luci-i18n-irqbalance-zh-cn luci-app-airoha-npu xr1710g-status-core luci-i18n-airoha-npu-zh-cn luci-app-airoha-fancontrol luci-i18n-airoha-fancontrol-zh-cn airoha-en7581-mt7996-npu-firmware fitblk kmod-hwmon-nct7802 kmod-mt7996e kmod-mt7996-firmware kmod-nft-offload kmod-phy-realtek rtl826x-firmware wpad-basic-mbedtls'
          for package_name in $required_packages; do
            grep -Fqx "CONFIG_PACKAGE_${package_name}=y" .config || {
              echo "Required package was not selected: $package_name"
              exit 1
            }
          done

          required_symbols='CONFIG_USE_APK=y CONFIG_TARGET_ROOTFS_SQUASHFS=y CONFIG_BUSYBOX_CONFIG_DEVMEM=y CONFIG_DRIVER_11BE_SUPPORT=y CONFIG_PACKAGE_dnsmasq_full_nftset=y'
          for symbol in $required_symbols; do
            grep -Fqx "$symbol" .config || {
              echo "Required configuration was not selected: $symbol"
              exit 1
            }
          done

          forbidden_packages='luci-theme-bootstrap luci-theme-glass luci-app-argon-config luci-i18n-argon-config-zh-cn luci-app-package-manager luci-app-airoha-flowsense luci-app-mlo luci-i18n-glass-zh-cn luci-i18n-mlo-zh-cn ethtool-full iperf3 kmod-airoha-net-debug mdio-tools openssh-sftp-server phytool tcpdump btop kmod-wireguard wireguard-tools luci-proto-wireguard'
          for package_name in $forbidden_packages; do
            if grep -Fqx "CONFIG_PACKAGE_${package_name}=y" .config; then
              echo "Forbidden package was selected: $package_name"
              exit 1
            fi
          done

          if grep -Fq 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config; then
            echo 'Initramfs was unexpectedly enabled'
            exit 1
          fi

          cp .config ../resolved-xr1710g-6.18-openclash.config
          ./scripts/diffconfig.sh > ../resolved-xr1710g-6.18-openclash.diffconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8 || true
          find dl -type f -size -1024c -print -delete
          make download -j8
          if find dl -type f -size -1024c -print -quit | grep -q .; then
            echo 'One or more source downloads are still incomplete'
            exit 1
          fi

      - name: Skip Airoha power-domain backport already present in Linux 6.18.53
        working-directory: openwrt
        run: |
          set -eu
          kernel_tarball=dl/linux-6.18.53.tar.xz
          source_path=linux-6.18.53/drivers/pmdomain/mediatek/Kconfig
          patch=target/linux/airoha/patches-6.18/0403-pmdomain-airoha-expose-kconfig-symbol-on-ARCH_AIROHA.patch
          source_file=/tmp/airoha-pmdomain-Kconfig-linux-6.18.53
          test -s "$kernel_tarball"
          test -s "$patch"
          grep -Fq 'Subject: [PATCH] pmdomain: airoha: expose Kconfig symbol on ARCH_AIROHA' "$patch"
          tar -xOf "$kernel_tarball" "$source_path" > "$source_file"
          python3 - "$source_file" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text()
          start = text.index('menu "MediaTek PM Domains"')
          end = text.index("endmenu", start) + len("endmenu")
          menu = text[start:end]
          symbol = "config AIROHA_CPU_PM_DOMAIN"
          if symbol in menu:
              raise SystemExit("Airoha power-domain symbol is still inside the MediaTek-only menu")
          outside = text[end:]
          if symbol not in outside:
              raise SystemExit("Linux 6.18.53 does not expose the Airoha power-domain symbol outside the menu")
          block = outside[outside.index(symbol):]
          required = (
              "depends on ARCH_AIROHA || COMPILE_TEST",
              "depends on HAVE_ARM_SMCCC",
              "depends on PM",
              "select PM_GENERIC_DOMAINS",
          )
          for line in required:
              if line not in block:
                  raise SystemExit(f"Linux 6.18.53 Airoha power-domain config is missing: {line}")
          PY
          rm "$patch"
          test ! -e "$patch"
          echo 'Omitted redundant Airoha power-domain backport; Linux 6.18.53 already exposes the symbol under ARCH_AIROHA.'

      - name: Skip backports already included in Linux 6.18.53
        working-directory: openwrt
        run: |
          set -eu
          kernel_tarball=dl/linux-6.18.53.tar.xz
          mhi_source=linux-6.18.53/drivers/bus/mhi/host/pci_generic.c
          mhi_patch=target/linux/generic/backport-6.18/706-v7.2-bus-mhi-host-pci_generic-round-up-nr_irqs-to-a-power-of-two.patch
          qca8k_source=linux-6.18.53/drivers/net/dsa/qca/qca8k-8xxx.c
          qca8k_patch=target/linux/generic/backport-6.18/751-v7.2-net-dsa-qca8k-add-support-for-force-mode-for-fixed-l.patch
          kernel_check_dir=/tmp/xr1710g-linux-6.18.53-check
          test -s "$kernel_tarball"
          mkdir -p "$kernel_check_dir"
          tar -xOf "$kernel_tarball" "$mhi_source" > "$kernel_check_dir/pci_generic.c"
          tar -xOf "$kernel_tarball" "$qca8k_source" > "$kernel_check_dir/qca8k-8xxx.c"
          grep -Fq 'pci_alloc_irq_vectors(pdev, 1, roundup_pow_of_two(mhi_cntrl->nr_irqs),' \
            "$kernel_check_dir/pci_generic.c" || {
              echo 'Linux 6.18.53 tarball does not contain the expected MHI IRQ fix'
              exit 1
            }
          test -f "$mhi_patch" || { echo "Missing expected MHI backport: $mhi_patch"; exit 1; }
          grep -Fq 'roundup_pow_of_two(mhi_cntrl->nr_irqs)' "$mhi_patch" || {
            echo "MHI backport is not the redundant fix: $mhi_patch"
            exit 1
          }
          rm "$mhi_patch"
          test ! -e "$mhi_patch"

          grep -Fq 'mask |= QCA8K_PORT_PAD_SGMII_FORCE_MODE;' \
            "$kernel_check_dir/qca8k-8xxx.c" || {
              echo 'Linux 6.18.53 tarball does not contain the expected QCA8K force-mode change'
              exit 1
            }
          test -f "$qca8k_patch" || { echo "Missing expected QCA8K backport: $qca8k_patch"; exit 1; }
          grep -Fq 'mask |= QCA8K_PORT_PAD_SGMII_FORCE_MODE;' "$qca8k_patch" || {
            echo "QCA8K backport is not the redundant fix: $qca8k_patch"
            exit 1
          }
          rm "$qca8k_patch"
          test ! -e "$qca8k_patch"

      - name: Rebase nft flow bridging backport onto Linux 6.18.53
        run: |
          set -eu
          patch=patches/xr1710g/675-02-nft_flow_offload-add-bridging-support.patch
          target=openwrt/target/linux/generic/pending-6.18/675-02-nft_flow_offload-add-bridging-support.patch
          test -s "$patch"
          grep -Fq 'route->tuple[dir].out.ifindex = info.outdev->ifindex;' "$patch"
          grep -Fq 'nft_dev_forward_path(pkt, route, ct, dir, ft)' "$patch"
          test -f "$target"
          install -m 0644 "$patch" "$target"
          cmp -s "$patch" "$target"

      - name: Rebase internal phylink PCS backport onto Linux 6.18.53
        working-directory: openwrt
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          patch = Path("target/linux/generic/pending-6.18/737-02-net-phylink-introduce-internal-phylink-PCS-handling.patch")
          text = patch.read_text()
          changes = (
              ("-\tif (!pcs)\n+\tif (!pcs_found)", "-\tif (IS_ERR_OR_NULL(pcs))\n+\tif (!pcs_found)"),
              (
                  "+\t\tpcs = pl->mac_ops->mac_select_pcs(pl->config,\n+\t\t\t\t\t\t  interface);\n+\t\tpcs_found = !!pcs;",
                  "+\t\tpcs = pl->mac_ops->mac_select_pcs(pl->config,\n+\t\t\t\t\t\t  interface);\n+\t\tpcs_found = !IS_ERR_OR_NULL(pcs);",
              ),
          )
          for old, new in changes:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one phylink patch context, found {text.count(old)}: {old!r}")
              text = text.replace(old, new, 1)
          patch.write_text(text)
          PY

      - name: Omit unrelated RTL8365MB backports that do not apply to Linux 6.18.53
        working-directory: openwrt
        run: |
          set -eu
          shopt -s nullglob
          patches=(target/linux/generic/backport-6.18/942-*.patch \
            target/linux/generic/backport-6.18/943-*.patch \
            target/linux/generic/backport-6.18/944-*.patch)
          if [[ "${#patches[@]}" -ne 15 ]]; then
            printf 'Expected 15 unrelated RTL8365MB backports, found %s\n' "${#patches[@]}"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            printf 'Omitting non-target RTL8365MB backport: %s\n' "$patch"
            rm "$patch"
            test ! -e "$patch"
          done
          test ! -e target/linux/generic/backport-6.18/942-04-v7.2-net-dsa-realtek-rtl8365mb-prepare-for-multiple-sourc.patch

      - name: Rebase XR1710G fixed-layout MAC address support onto Linux 6.18.53
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch = Path("target/linux/generic/pending-6.18/804-nvmem-core-support-mac-base-fixed-layout-cells.patch")
          text = patch.read_text()
          old = "static int nvmem_add_cells_from_dt(struct nvmem_device *nvmem, struct device_node *np)"
          new = "int nvmem_add_cells_from_dt(struct nvmem_device *nvmem, struct device_node *np)"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one outdated nvmem function context, found {text.count(old)}")
          patch.write_text(text.replace(old, new))
          if new not in patch.read_text():
              raise SystemExit("Failed to update the fixed-layout MAC patch context")

          patch = Path("target/linux/generic/pending-6.18/809-01-nvmem-core-generalize-mac-base-cells-handling.patch")
          text = patch.read_text()
          old = "static int nvmem_add_cells_from_dt(struct nvmem_device *nvmem, struct device_node *np)"
          new = "int nvmem_add_cells_from_dt(struct nvmem_device *nvmem, struct device_node *np)"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one outdated nvmem context, found {text.count(old)}")
          patch.write_text(text.replace(old, new))
          if old in patch.read_text():
              raise SystemExit("Failed to update both generalized nvmem patch contexts")
          PY

      - name: Skip xHCI backport already present in Linux 6.18.53
        working-directory: openwrt
        run: |
          set -eu
          patch=target/linux/generic/pending-6.18/891-usb-xhci-handle-port-events-when-there-is-one-roothub.patch
          test -s "$patch"
          grep -Fq 'Subject: [PATCH] usb: xhci: Handle USB3 port events when there is one roothub' "$patch"
          grep -Fq 'xhci->shared_hcd == NULL' "$patch"
          grep -Fq 'xhci_get_usb3_hcd(xhci) == NULL' "$patch"
          curl -fsSL "https://raw.githubusercontent.com/gregkh/linux/v${KERNEL_VERSION}/drivers/usb/host/xhci-ring.c" \
            -o /tmp/xhci-ring-linux-${KERNEL_VERSION}.c
          grep -Fq 'if (port->rhub == &xhci->usb3_rhub && xhci_get_usb3_hcd(xhci) == NULL)' \
            "/tmp/xhci-ring-linux-${KERNEL_VERSION}.c"
          rm "$patch"
          test ! -e "$patch"
          echo 'Omitted xHCI backport because the pinned Linux 6.18.53 source already contains it.'

      - name: Rebase kernel tools portability patch onto Linux 6.18.53
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch = Path("target/linux/generic/hack-6.18/200-tools_portability.patch")
          lines = patch.read_text().splitlines()
          markers = [
              "@@ -72,8 +72,6 @@",
              "@@ -84,6 +82,9 @@",
              "@@ -95,8 +96,9 @@",
          ]
          positions = []
          for marker in markers:
              found = [i for i, line in enumerate(lines) if line.startswith(marker)]
              if len(found) != 1:
                  raise SystemExit(f"Expected one portability hunk {marker}, found {len(found)}")
              positions.append(found[0])
          first, second, third = positions
          if not first < second < third:
              raise SystemExit("Portability patch hunk order changed")
          if not any(line.startswith("-CC_NO_CLANG :=") for line in lines[first:second]):
              raise SystemExit("Expected obsolete CC_NO_CLANG move hunk was not found")
          if not any(line.startswith("+HOSTCC_NO_CLANG :=") for line in lines[second:third]):
              raise SystemExit("Expected HOSTCC_NO_CLANG addition was not found")

          rebased_hunk = [
              "@@ -95,1 +95,2 @@",
              ' CC_NO_CLANG := $(shell $(CC) -dM -E -x c /dev/null | grep -Fq "__clang__"; echo $$?)',
              '+HOSTCC_NO_CLANG := $(shell $(HOSTCC) -dM -E -x c /dev/null | grep -Fq "__clang__"; echo $$?)',
          ]
          lines = lines[:first] + rebased_hunk + lines[third:]
          patch.write_text("\n".join(lines) + "\n")
          if "@@ -72,8 +72,6 @@" in patch.read_text():
              raise SystemExit("Obsolete CC_NO_CLANG move hunk survived the rebase")
          PY

      - name: Omit unrelated MediaTek Ethernet/PPE backports for this Airoha target
        working-directory: openwrt
        run: |
          set -eu
          shopt -s nullglob
          patches=(target/linux/generic/pending-6.18/*net-ethernet-mediatek*.patch \
            target/linux/generic/pending-6.18/*net-ethernet-mtk_eth_soc*.patch \
            target/linux/generic/pending-6.18/*net-ethernet-mtk_ppe*.patch)
          if [[ "${#patches[@]}" -ne 23 ]]; then
            printf 'Expected 23 unrelated MediaTek Ethernet/PPE patches, found %s\n' "${#patches[@]}"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            test -s "$patch"
            grep -Eq '^Subject: .*net: ethernet: (mediatek|mtk_eth_soc|mtk_ppe)' "$patch"
            printf 'Omitting non-target MediaTek Ethernet/PPE patch: %s\n' "$patch"
            rm "$patch"
            test ! -e "$patch"
          done
          test ! -e target/linux/generic/pending-6.18/736-04-net-ethernet-mediatek-fix-ppe-flow-accounting-for-L2.patch
          test ! -e target/linux/generic/pending-6.18/738-01-net-ethernet-mtk_eth_soc-reduce-rx-ring-size-for-older.patch
          test ! -e target/linux/generic/pending-6.18/738-02-net-ethernet-mtk_eth_soc-do-not-enable-page-pool-sta.patch
          echo 'Omitted MediaTek Ethernet/PPE-only backports; XR1710G uses the Airoha EN7581 SoC.'

      - name: Build the XR1710G sysupgrade
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify and package the firmware
        run: |
          target_dir=openwrt/bin/targets/airoha/an7581
          manifest=$(find "$target_dir" -maxdepth 1 \
            -name '*gemtek_xr1710g-ubi.manifest' -print -quit)
          sysupgrade=$(find "$target_dir" -maxdepth 1 \
            -name '*gemtek_xr1710g-ubi-squashfs-sysupgrade.itb' -print -quit)
          test -n "$manifest" && test -s "$manifest"
          test -n "$sysupgrade" && test -s "$sysupgrade"

          required_manifest='luci-theme-argon luci-app-openclash bash curl dnsmasq-full kmod-inet-diag kmod-nft-tproxy kmod-tun ruby ruby-yaml unzip luci-app-upnp luci-i18n-upnp-zh-cn miniupnpd-nftables coreutils-nohup etherwake irqbalance luci-app-irqbalance luci-i18n-irqbalance-zh-cn luci-app-airoha-npu xr1710g-status-core luci-app-airoha-fancontrol airoha-en7581-mt7996-npu-firmware fitblk kmod-hwmon-nct7802 kmod-i2c-an7581 kmod-mt7996e kmod-mt7996-firmware kmod-nft-offload kmod-phy-realtek rtl826x-firmware wpad-basic-mbedtls'
          for package_name in $required_manifest; do
            grep -q "^${package_name} - " "$manifest" || {
              echo "Required package missing from firmware: $package_name"
              exit 1
            }
          done

          forbidden_manifest='luci-theme-bootstrap luci-theme-glass luci-app-argon-config luci-i18n-argon-config-zh-cn luci-app-package-manager luci-app-airoha-flowsense luci-app-mlo ethtool-full iperf3 kmod-airoha-net-debug mdio-tools openssh-sftp-server phytool tcpdump btop kmod-wireguard wireguard-tools luci-proto-wireguard'
          for package_name in $forbidden_manifest; do
            if grep -q "^${package_name} - " "$manifest"; then
              echo "Forbidden package present in firmware: $package_name"
              exit 1
            fi
          done

          themes=$(awk '/^luci-theme-/ { print $1 }' "$manifest")
          test "$themes" = 'luci-theme-argon' || {
            echo "Unexpected theme set: $themes"
            exit 1
          }

          core_in_root=$(find openwrt/build_dir \
            -path '*/root-airoha/etc/openclash/core/clash_meta' -print -quit)
          test -n "$core_in_root" && test -x "$core_in_root"
          file "$core_in_root" | grep -q 'ARM aarch64'

          grep -Fq 'gemtek_xr1710g-ubi' "$target_dir/profiles.json"
          grep -q '^kernel - 6\.18\.53' "$manifest"

          mkdir -p output/firmware output/build-record
          cp "$sysupgrade" output/firmware/
          cp "$manifest" output/firmware/
          cp resolved-xr1710g-6.18-openclash.config \
            resolved-xr1710g-6.18-openclash.diffconfig \
            output/build-record/
          for extra in profiles.json feeds.buildinfo version.buildinfo; do
            [ ! -f "$target_dir/$extra" ] || cp "$target_dir/$extra" output/build-record/
          done

          sysupgrade_bytes=$(stat -c '%s' "$sysupgrade")
          printf '%s\n' \
            "Release: $RELEASE_TAG" \
            "Board: gemtek,xr1710g-ubi" \
            "Source commit: $SOURCE_COMMIT" \
            'Kernel: 6.18.53 (best-effort reconstruction; not the unpublished v1.9 source)' \
            "Community package source commit: $COMMUNITY_COMMIT" \
            "OpenClash: $OPENCLASH_TAG" \
            "Mihomo: $MIHOMO_TAG ARM64" \
            'Theme: Argon only' \
            'WireGuard packages: none' \
            "Sysupgrade bytes: $sysupgrade_bytes" \
            'APK release assets: none' \
            > output/build-record/release-info.txt

          image_count=$(find output/firmware -maxdepth 1 -type f \
            \( -name '*.itb' -o -name '*.bin' \) | wc -l)
          test "$image_count" -eq 1
          if find output -type f \( -name '*.apk' -o -name 'packages.adb' \) \
            -print -quit | grep -q .; then
            echo 'APK packages or an APK index leaked into the release output'
            exit 1
          fi

          (
            cd output
            find firmware build-record -type f \
              -exec sha256sum '{}' + | sort -k2 > SHA256SUMS
            awk '{ name=$2; sub(/^.*\//, "", name); print $1 "  " name }' \
              SHA256SUMS | sort -k2 > RELEASE-SHA256SUMS
          )

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XR1710G-6.18.53-Reconstruction-OpenClash-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/
          retention-days: 90
          compression-level: 0

      - name: Publish the verified sysupgrade release
        run: |
          printf '%s\n' \
            '## XR1710G 6.18.53 best-effort OpenClash reconstruction' \
            '' \
            '- Board: `gemtek,xr1710g-ubi`.' \
            '- Uses the public YYH XR1710G integration tree at its verified commit with the verified Linux 6.18.53 stable tarball/hash.' \
            '- Carries the v1.9 tag public MT76 backports 0102-0105, the NPU-stack rebase, and PPE local-flow guard 9991.' \
            '- Skips the OpenWrt MHI IRQ and QCA8K force-mode backports because Linux 6.18.53 already contains both changes.' \
            '- Includes Simplified Chinese LuCI, Argon, OpenClash + ARM64 Mihomo, UPnP, nohup, etherwake, irqbalance, Airoha SoC Status, Airoha Fan Control and NPU/PPE support.' \
            '- This is a best-effort kernel reconstruction. The v1.9 matching source is unpublished, so this image is not claimed to reproduce its binary or its release-only EHT320, RX/LRO, MLO/OWE and LuCI-cache changes.' \
            '- Argon is the only LuCI theme.' \
            '- Does not include FlowSense, MLO management, Argon configuration app, package-manager UI, diagnostic bundles or WireGuard packages.' \
            '- Publishes one `sysupgrade.itb` firmware image and no APK package repository.' \
            '' \
            '**This image is only for the XR1710G UBI layout. Do not flash it on W1700K/W1701K. Use a clean flash and do not force an incompatible image.**' \
            > release-notes.md

          gh release create "$RELEASE_TAG" \
            --title 'XR1710G 6.18.53 Best-Effort OpenClash Sysupgrade' \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --prerelease

          find output/firmware output/build-record -type f -print0 \
            | xargs -0 -n 50 gh release upload "$RELEASE_TAG" --clobber
          gh release upload "$RELEASE_TAG" output/RELEASE-SHA256SUMS --clobber

          find output/firmware output/build-record -type f -printf '%f\n' \
            | LC_ALL=C sort > expected-assets.txt
          basename output/RELEASE-SHA256SUMS >> expected-assets.txt
          LC_ALL=C sort -o expected-assets.txt expected-assets.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt
          if grep -Eq '\.apk$|^packages\.adb$' uploaded-assets.txt; then
            echo 'APK output was unexpectedly uploaded'
            exit 1
          fi
